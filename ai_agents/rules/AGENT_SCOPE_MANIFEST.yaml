    owned_scope:
      - research/strategies/manifests/breakout_from_compression_v1.yaml
      - core/strategy_layer/strategies/breakout/
      - strategy_research/breakout_from_compression_v1/
      - strategy_stewards/
      - backtests/strategies/
      - telemetry/strategies/
    read_only_scope:
      - backtests/system/
      - data/ai_control/strategy_telemetry/
      - trading/freqtrade/user_data/runtime_artifacts/
      - research/system_backtests/
    forbidden_scope:
      - .env
