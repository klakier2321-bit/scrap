  defense_only_steward:
    role: strategy_steward
    owned_scope:
      - research/strategies/manifests/defense_only_v1.yaml
      - core/strategy_layer/strategies/defense/
      - strategy_research/defense_only_v1/
      - strategy_stewards/
      - backtests/strategies/
      - telemetry/strategies/
    read_only_scope:
      - backtests/system/
      - data/ai_control/strategy_telemetry/
      - trading/freqtrade/user_data/runtime_artifacts/
      - research/system_backtests/
    forbidden_scope:
