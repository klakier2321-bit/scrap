    owned_scope:
      - research/strategies/manifests/range_mean_reversion_v1.yaml
      - core/strategy_layer/strategies/range/
      - strategy_research/range_mean_reversion_v1/
      - strategy_stewards/
      - backtests/strategies/
      - telemetry/strategies/
    read_only_scope:
      - backtests/system/
      - data/ai_control/strategy_telemetry/
      - trading/freqtrade/user_data/runtime_artifacts/
      - research/system_backtests/
    forbidden_scope:
      - .env
      - docker-compose.yml
      - core/risk_management/
      - core/risk_manager.py
      - trading/freqtrade/user_data/config.json
    write_mode: owned_scope_only

  panic_reversal_steward:
    role: strategy_steward
    owned_scope:
      - research/strategies/manifests/panic_reversal_v1.yaml
      - core/strategy_layer/strategies/event/
      - strategy_research/panic_reversal_v1/
      - strategy_stewards/
      - backtests/strategies/
      - telemetry/strategies/
    read_only_scope:
      - backtests/system/
      - data/ai_control/strategy_telemetry/
      - trading/freqtrade/user_data/runtime_artifacts/
