      - "backtests/system/"
      - "telemetry/strategies/"
      - "data/ai_control/strategy_telemetry/"
      - "trading/freqtrade/user_data/strategies/"
      - "research/system_backtests/"
    handoff_targets:
      - "regime_model_agent"
      - "feature_engineering_agent"
      - "risk_research_agent"
      - "experiment_evaluation_agent"
      - "alpha_research_agent"
      - "trend_pullback_steward"
      - "breakout_from_compression_steward"
      - "range_mean_reversion_steward"
      - "panic_reversal_steward"
