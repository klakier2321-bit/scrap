autopilot:
  objective: "Utrzymuj paper-ready, canonical futures runtime: regime -> risk -> strategy layer -> execution guard -> telemetry -> system replay. Nie reaktywuj legacy candidate-first lanes."
  auto_start: true
  poll_interval_seconds: 600
  max_cycles: 0

  tasks:
    - name: "canonical_strategy_governance"
      agent_name: "strategy_agent"
      goal: "Pilnuj lifecycle kanonicznych strategii, stewardow, manifestow i replay evidence. Nie reaktywuj research/candidates jako runtime source."
      business_reason: "System ma pozostac canonical-strategy-first i tani kosztowo."
      requested_paths:
        - "research/strategies/"
        - "strategy_research/"
        - "strategy_stewards/"
        - "docs/ARCHITECTURE.md"
        - "backtests/system/"
      risk_level: "low"
      cross_layer: false
      does_touch_contract: false
      does_touch_runtime: false
      force_strong_model: false
      auto_approve: false
      allow_parallel: true

    - name: "regime_runtime_maintenance"
      agent_name: "regime_model_agent"
      goal: "Utrzymuj kanoniczny Regime Detector i replay semantics dla futures. Priorytet to stabilnosc kontraktu, nie eksperymenty candidate-first."
      business_reason: "Regime engine jest pierwszym gatingiem dla risk i strategy layer."
      requested_paths:
        - "core/regime_detector.py"
        - "research/regimes/"
        - "docs/REGIME_DETECTION.md"
        - "data/ai_control/regime/"
        - "core/tests/test_regime_detector.py"
      risk_level: "medium"
      cross_layer: false
      does_touch_contract: true
      does_touch_runtime: false
      force_strong_model: false
      auto_approve: false
      allow_parallel: true

    - name: "feature_packet_maintenance"
      agent_name: "feature_engineering_agent"
      goal: "Dostarczaj lekkie packets i manifesty cech dla regime, replay i canonical strategies. Preferuj artifact-first context zamiast szerokich promptow."
      business_reason: "Niskokosztowy system agentowy musi opierac sie na gotowych artefaktach, nie na dumpach repo."
      requested_paths:
        - "research/features/"
        - "research/datasets/"
        - "research/regimes/"
        - "docs/FEATURE_STORE.md"
        - "data/ai_control/"
      risk_level: "low"
      cross_layer: false
      does_touch_contract: false
      does_touch_runtime: false
      force_strong_model: false
      auto_approve: false
      allow_parallel: true

    - name: "regime_risk_mapping"
      agent_name: "risk_research_agent"
      goal: "Utrzymuj regime-aware mapowanie ryzyka futures, ale nie zmieniaj centralnego risk desk bez jawnego review."
      business_reason: "Risk ma pozostac centralny, twardy i przewidywalny."
      requested_paths:
        - "research/risk/"
        - "docs/RISK_MODEL_FUTURES.md"
        - "core/risk_management/"
        - "core/risk_manager.py"
        - "backtests/system/"
      risk_level: "low"
      cross_layer: false
      does_touch_contract: false
      does_touch_runtime: false
      force_strong_model: false
      auto_approve: false
      allow_parallel: true
