coding_runtime:
  enabled: true
  auto_start: true
  lead_refresh_interval_seconds: 300
  dispatcher_poll_interval_seconds: 60
  max_active_tasks: 1
  max_target_files: 6

  modules:
    - module_id: "regime_detection"
      owner_agent: "regime_model_agent"
      enabled: true
      priority: 100
      max_target_files: 3
      title: "Regime detection"
      module_summary: "Utrzymuj kanoniczny, futures-aware regime detector jako pierwszy gate dla risk i strategy layer."
      read_only_context:
        - "docs/REGIME_DETECTION.md"
        - "docs/ARCHITECTURE.md"
        - "data/ai_control/regime/"
        - "backtests/system/"
      target_candidates:
        - "core/regime_detector.py"
        - "research/regimes/"
        - "core/tests/test_regime_detector.py"
      acceptance_checks:
        - "Kontrakt regime_report pozostaje stabilny."
        - "Brak future leak w replay."
        - "Zmiana nie narusza centralnego risk desk."
      required_tests:
        - "python -m compileall core"
        - "python -m unittest core.tests.test_regime_detector"
      definition_of_done:
        - "Regime detector pozostaje canonical source dla futures runtime."
        - "Artefakty replay i latest.json sa zgodne z kontraktem."

    - module_id: "regime_feature_support"
      owner_agent: "feature_engineering_agent"
      enabled: true
      priority: 98
      max_target_files: 3
      title: "Regime feature support"
      module_summary: "Buduj lekkie feature packets i manifesty dla regime, replay i stewardow strategii."
      read_only_context:
        - "docs/FEATURE_STORE.md"
        - "docs/RESEARCH_LAYER.md"
        - "data/ai_control/"
        - "backtests/system/"
      target_candidates:
        - "research/features/"
        - "research/datasets/"
        - "research/regimes/"
      acceptance_checks:
        - "Preferowane sa lekkie packets, nie szerokie prompt dumps."
        - "Nowe cechy sa auditowalne i wersjonowane."
        - "Brak zmian w runtime tradingowym."
      required_tests:
        - "python -m unittest core.tests.test_regime_detector"
      definition_of_done:
        - "Feature artifacts wspieraja regime i strategy replay."
        - "Context packets pozostaja male i tanie."

    - module_id: "regime_risk_mapping"
      owner_agent: "risk_research_agent"
      enabled: true
      priority: 97
      max_target_files: 3
      title: "Regime risk mapping"
      module_summary: "Utrzymuj mapowanie regime -> risk dla futures, bez omijania centralnego risk desk."
      read_only_context:
        - "docs/RISK_MODEL_FUTURES.md"
        - "docs/SYSTEM_OPERATING_MODEL.md"
        - "backtests/system/"
        - "data/ai_control/risk_decisions/"
      target_candidates:
        - "research/risk/"
        - "core/risk_management/"
        - "core/risk_manager.py"
      acceptance_checks:
        - "Risk pozostaje centralny i nadrzedny wobec strategii."
        - "Brak local leverage logic wewnatrz strategii."
        - "Replay block reasons pozostaja czytelne."
      required_tests:
        - "python -m unittest core.tests.test_risk_manager core.tests.test_risk_engine_scenarios"
      definition_of_done:
        - "Istnieje jawne regime-aware risk mapping."
        - "Zmiana nie oslabia execution enforcement."

    - module_id: "canonical_strategy_stewarding"
      owner_agent: "strategy_agent"
      enabled: true
      priority: 96
      max_target_files: 4
      title: "Canonical strategy stewardship"
      module_summary: "Pilnuj kanonicznych manifestow, stewardingu, lifecycle i replay evidence dla 5 strategii startowych."
      read_only_context:
        - "research/strategies/"
        - "strategy_research/"
        - "strategy_stewards/"
        - "backtests/system/"
        - "telemetry/strategies/"
      target_candidates:
        - "research/strategies/manifests/"
        - "core/strategy_layer/"
        - "strategy_research/"
        - "strategy_stewards/"
      acceptance_checks:
        - "Brak runtime reads z research/candidates."
        - "Signal contract i manifest contract pozostaja kompatybilne."
        - "Stewardzi nie przejmuja risk ani execution responsibility."
      required_tests:
        - "python -m unittest core.tests.test_strategy_layer"
      definition_of_done:
        - "Canonical strategy layer pozostaje jedynym source of truth dla futures."
        - "Stewarding jest zorganizowany per strategia, ale domyslnie wylaczony."

    - module_id: "ops_observability_and_cost_control"
      owner_agent: "ops_observability_agent"
      enabled: true
      priority: 94
      max_target_files: 4
      title: "Ops observability and cost control"
      module_summary: "Buduj Grafana visibility, executive report, agent cost guardrails i operator-safe UI bez chat-first UX."
      read_only_context:
        - "core/executive_report.py"
        - "core/metrics.py"
        - "data/ai_control/"
        - "backtests/system/"
        - "trading/freqtrade/user_data/runtime_artifacts/"
      target_candidates:
        - "core/metrics.py"
        - "core/executive_report.py"
        - "core/templates/operator.html"
        - "infrastructure/grafana/"
        - "monitoring/"
      acceptance_checks:
        - "Jeden owner dla Grafany i kosztow agentow."
        - "UI/operator surfaces sa stanowe i tanie."
        - "Brak zaleznosci od czatu LLM do podstawowego monitoringu."
      required_tests:
        - "python -m unittest core.tests.test_executive_report"
      definition_of_done:
        - "Operator widzi status, budzety i blokady agentow."
        - "Grafana moze czytac metryki kosztow i statusow per agent."

    - module_id: "control_layer_runtime"
      owner_agent: "control_layer_agent"
      enabled: true
      priority: 92
      max_target_files: 4
      title: "Control layer"
      module_summary: "Utrzymuj control API, orchestrator i system replay integration bez naruszania trading runtime."
      read_only_context:
        - "docs/ARCHITECTURE.md"
        - "docs/PROJECT_MAP.md"
        - "data/ai_control/"
        - "backtests/system/"
      target_candidates:
        - "core/"
        - "ai_agents/runtime/"
      acceptance_checks:
        - "Control layer nie daje agentom write access do live runtime."
        - "Diff jest maly, reviewable i kontraktowy."
        - "Replay i operator API pozostaja zgodne."
      required_tests:
        - "python -m unittest core.tests.test_control_layer core.tests.test_system_backtest"
      definition_of_done:
        - "Control layer wspiera canonical futures runtime i guarded agents."
        - "Brak candidate-first dependencies na sciezce runtime."
